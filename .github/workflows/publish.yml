name: Publish

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - run: dotnet pack -c Release -o ./nupkgs
    - run: dotnet nuget push "nupkgs/*.nupkg" --source "https://nuget.pkg.github.com/Frensqq/index.json" --api-key ${{ secrets.GITHUB_TOKEN }}