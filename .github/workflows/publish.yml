name: Publish

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore
      run: dotnet restore
    
    - name: Build
      run: dotnet build -c Release
    
    - name: Pack
      run: dotnet pack -c Release -o ./nupkgs --no-build
    
    - name: Push
      run: dotnet nuget push "nupkgs/*.nupkg" --source "https://nuget.pkg.github.com/frensqq/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate